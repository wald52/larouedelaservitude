[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Runtime des fonctions modernes et adresse canonique vers laquelle les pages
# sociales doivent rediriger. PUBLIC_SITE_URL n'est pas un secret : la définir
# ici évite qu'un partage commencé sur GitHub Pages bascule l'utilisateur vers
# un second stockage local sur le domaine Netlify.
[build.environment]
  NODE_VERSION = "20"
  PUBLIC_SITE_URL = "https://wald52.github.io/larouedelaservitude/"

# Les fonctions appliquent elles-mêmes leur allow-list CORS, leur validation
# d'origine et leurs limites natives Netlify. Ne pas ajouter de wildcard CORS
# ici : il écraserait la politique applicative.

# Le script du service worker doit être revalidé à chaque vérification, sans
# quoi une nouvelle génération pourrait rester invisible au navigateur.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# index.html est servi depuis le cache du service worker ; ces en-têtes
# concernent surtout le premier chargement et les navigateurs sans SW.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# Les données sont revalidées par js/entries.js avec le paramètre ?fresh=.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# Les assets portant ?v=<hachage> sont immuables. Une correction produit une
# nouvelle URL, tandis qu'un fichier inchangé reste en cache.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bills.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
