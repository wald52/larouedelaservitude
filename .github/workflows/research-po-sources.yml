name: Research compulsory levies sources

on:
  push:
    branches: ["data/audit-prelevements-obligatoires-2026"]
    paths:
      - ".github/workflows/research-po-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook tooling
        run: python -m pip install --disable-pip-version-check openpyxl xlrd

      - name: Download authoritative European sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p research/raw research/extracted
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 \
            -A "Mozilla/5.0 (compatible; LaRoueDeLaServitudeResearch/1.0)" \
            "https://taxation-customs.ec.europa.eu/document/download/600d56d1-ea6e-416e-9981-1c8b9c603b6b_en?filename=NTL%20edition%202026%20web.xlsx" \
            -o research/raw/national-tax-list-2026.xlsx
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 \
            -A "Mozilla/5.0 (compatible; LaRoueDeLaServitudeResearch/1.0)" \
            "https://taxation-customs.ec.europa.eu/document/download/9392a0fe-fc17-4cb6-b9c9-56e71f21caec_en?filename=Methodology2026.pdf" \
            -o research/raw/taxation-trends-methodology-2026.pdf

      - name: Download authoritative French budget and social-security sources
        shell: bash
        run: |
          set -euxo pipefail

          # budget.gouv.fr protège parfois ses fichiers fid-download par un défi
          # anti-bot. Leur absence ne doit pas bloquer les autres sources : les
          # mêmes impositions seront recoupées dans la LFI consolidée.
          if ! curl -fL --retry 2 --retry-all-errors --retry-delay 2 \
            -A "Mozilla/5.0 (compatible; LaRoueDeLaServitudeResearch/1.0)" \
            -e "https://www.budget.gouv.fr/documentation/documents-budgetaires-lois/exercice-2026" \
            "https://www.budget.gouv.fr/documentation/fid-download/80134" \
            -o research/raw/plf-2026-taxes-affectees.xls; then
            rm -f research/raw/plf-2026-taxes-affectees.xls
          fi
          if ! curl -fL --retry 2 --retry-all-errors --retry-delay 2 \
            -A "Mozilla/5.0 (compatible; LaRoueDeLaServitudeResearch/1.0)" \
            -e "https://www.budget.gouv.fr/documentation/documents-budgetaires-lois/exercice-2026" \
            "https://www.budget.gouv.fr/documentation/fid-download/80398" \
            -o research/raw/plf-2026-recettes-budget-general.xlsx; then
            rm -f research/raw/plf-2026-recettes-budget-general.xlsx
          fi

          curl -fL --retry 8 --retry-all-errors --retry-delay 3 \
            -A "Mozilla/5.0 (compatible; LaRoueDeLaServitudeResearch/1.0)" \
            "https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/Annexe%203%20PLFSS%202026%20Tableaux%20donn%C3%A9es%20.xlsx" \
            -o research/raw/plfss-2026-annexe-3.xlsx
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 \
            -A "Mozilla/5.0 (compatible; LaRoueDeLaServitudeResearch/1.0)" \
            "https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe3-20251015-103900-55-4_avec%20couverture.pdf" \
            -o research/raw/plfss-2026-annexe-3.pdf

          find research/raw -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > research/raw/SHA256SUMS

      - name: Fetch the shared discussion for research context
        shell: bash
        continue-on-error: true
        run: |
          set -x
          for url in \
            "https://chatgpt.com/share/6a96b3f0-0e28-83eb-85a5-514f97797078?ogimg=plain" \
            "https://chatgpt.com/backend-api/share/6a96b3f0-0e28-83eb-85a5-514f97797078" \
            "https://chat.openai.com/backend-api/share/6a96b3f0-0e28-83eb-85a5-514f97797078"
          do
            name=$(printf '%s' "$url" | sha256sum | cut -c1-12)
            curl -L --retry 3 --retry-all-errors \
              -A "Mozilla/5.0" -D "research/raw/chat-${name}.headers" \
              "$url" -o "research/raw/chat-${name}.body" || true
          done

      - name: Extract every workbook as UTF-8 CSV
        run: |
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path
          import xlrd
          from openpyxl import load_workbook

          raw = Path("research/raw")
          out = Path("research/extracted")
          out.mkdir(parents=True, exist_ok=True)
          profile = {"workbooks": []}

          def slug(value):
              return re.sub(r"[^a-z0-9]+", "-", value.casefold()).strip("-") or "sheet"

          def write_sheet(workbook_name, sheet_name, rows, max_row, max_column):
              path = out / f"{slug(workbook_name)}--{slug(sheet_name)}.csv"
              preview = []
              with path.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.writer(handle)
                  for row_number, values in enumerate(rows, start=1):
                      values = ["" if value is None else value for value in values]
                      writer.writerow(values)
                      if row_number <= 30:
                          preview.append(values[:40])
              return {
                  "title": sheet_name,
                  "max_row": max_row,
                  "max_column": max_column,
                  "csv": str(path),
                  "preview": preview
              }

          for source in sorted(raw.glob("*.xlsx")):
              workbook = load_workbook(source, read_only=True, data_only=True)
              item = {"file": source.name, "sheets": []}
              for sheet in workbook.worksheets:
                  item["sheets"].append(write_sheet(
                      source.stem,
                      sheet.title,
                      sheet.iter_rows(values_only=True),
                      sheet.max_row,
                      sheet.max_column
                  ))
              profile["workbooks"].append(item)

          for source in sorted(raw.glob("*.xls")):
              workbook = xlrd.open_workbook(source)
              item = {"file": source.name, "sheets": []}
              for sheet in workbook.sheets():
                  rows = (sheet.row_values(index) for index in range(sheet.nrows))
                  item["sheets"].append(write_sheet(
                      source.stem,
                      sheet.name,
                      rows,
                      sheet.nrows,
                      sheet.ncols
                  ))
              profile["workbooks"].append(item)

          (out / "workbook-profile.json").write_text(
              json.dumps(profile, ensure_ascii=False, indent=2, default=str),
              encoding="utf-8"
          )
          print(json.dumps({
              workbook["file"]: {
                  sheet["title"]: [sheet["max_row"], sheet["max_column"]]
                  for sheet in workbook["sheets"]
              }
              for workbook in profile["workbooks"]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Package repository draft alongside official sources
        run: |
          cp data/entries-full.json research/extracted/current-entries-full.json
          cp data/entries-light.json research/extracted/current-entries-light.json

      - name: Upload research bundle
        uses: actions/upload-artifact@v4
        with:
          name: compulsory-levies-research
          path: research/
          retention-days: 7
