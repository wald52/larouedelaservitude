<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="La roue de la servitude - Découvrez les 371 taxes et prélèvements obligatoires français de manière ludique. Une application web progressive (PWA) utilisable hors ligne."
    />
    <title>La roue de la servitude</title>

    <!-- 🚀 Préchargement ultra-agressif des ressources critiques -->
    <link
      rel="preload"
      href="data/entries-light.json"
      as="fetch"
      type="application/json"
      crossorigin="anonymous"
    />
    <link rel="preload" href="images/center3.avif" as="image" type="image/avif" />

    <!-- Favicons (nouveaux fichiers dans le dossier /icons) -->
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

    <!-- Icônes pour PWA (Progressive Web Apps) -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png" />

    <!-- Apple PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="La roue de la servitude" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="site.webmanifest" />

    <!-- Meta pour les réseaux sociaux (Open Graph / Twitter) -->
    <meta property="og:image" content="icons/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="icons/og-image.png" />

    <!-- Styles critiques (priorité haute) -->
    <!-- buttons.css est bloquant, contrairement aux deux suivants : il habille le
     bouton « Tourner la roue », visible d'emblée. Chargé en différé, ce bouton
     apparaîtrait d'abord nu. -->
    <link rel="stylesheet" href="buttons.css" />
    <link rel="stylesheet" href="bills.css" media="print" onload="this.media = 'all'" />
    <link rel="stylesheet" href="menu.css" media="print" onload="this.media = 'all'" />
    <noscript>
      <link rel="stylesheet" href="bills.css" />
      <link rel="stylesheet" href="menu.css" />
    </noscript>

    <style>
      :root {
        --bg: #f7f7f7;
        --fg: #111;
        --ring: #e5e7eb;
        --surface: #fff;
        --surface-alt: #fafafa;
        --surface-inset: #f0f0f0;
        --button-bg: #111;
        --button-fg: #fff;
        --legend: #666;
        --pointer: #111;
        --bubble-bg: #111;
        --bubble-fg: #fff;
        --tooltip-bg: #111;
        --tooltip-fg: #fff;
        --modal-surface: #fff;
        --modal-text: #111;
        --modal-muted: #333;
        --install-surface: #fff;
        --install-border: rgba(17, 17, 17, 0.12);
        --install-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
        --install-title: #111;
        --emoji-size: 80px;
        --bg-size: 200vw;
        /* Ambre : lisible aussi bien sur les fonds clairs que sur la bulle sombre */
        --focus: #f59e0b;
        /* Romaine du bandeau de titre. Pile entièrement système : aucune police
           n'est téléchargée, l'application reste complète hors ligne dès le
           premier chargement (cf. le refus de toute ressource tierce). */
        --serif:
          "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia,
          "Times New Roman", serif;
        --masthead-accent: #c00;
      }

      :root[data-theme="dark"] {
        --bg: #0f1115;
        --fg: #f3f4f6;
        --ring: #2a2f3a;
        --surface: #151922;
        --surface-alt: #10151d;
        --surface-inset: #242b38;
        --button-bg: #f3f4f6;
        --button-fg: #101317;
        --legend: #a1a1aa;
        --pointer: #f3f4f6;
        --bubble-bg: #f3f4f6;
        --bubble-fg: #101317;
        --tooltip-bg: #f3f4f6;
        --tooltip-fg: #101317;
        --modal-surface: #151922;
        --modal-text: #f3f4f6;
        --modal-muted: #cbd5e1;
        --install-surface: #151922;
        --install-border: rgba(243, 244, 246, 0.12);
        --install-shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
        --install-title: #f3f4f6;
        --focus: #f59e0b;
        --masthead-accent: #dc2626;
      }

      /* ===============================
   ACCESSIBILITÉ
   =============================== */

      /* Aucun style de focus n'existait : la navigation au clavier était invisible.
   :focus-visible ne se déclenche qu'au clavier, la souris reste inchangée. */
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      /* .bubble reçoit le focus par programme à l'ouverture du dialogue (openModal
   dans js/app.js) : pas de contour à afficher pour autant. */
      .bubble:focus,
      .bubble:focus-visible {
        outline: none;
      }

      /* Respect de la préférence système « mouvement réduit ». Couvre aussi
   menu.css et bills.css, chargés dans ce même document. La rotation de la
   roue et l'effet billets, pilotés en JS, sont traités dans js/app.js. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* 1️⃣ Tout hérite de la police principale */
      *,
      *::before,
      *::after {
        font-family: inherit;
      }

      /* 2️⃣ Police système + lissage */
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: contain; /* bloque l'effet "rebond" sur mobile */
        touch-action: none; /* empêche le scroll tactile */
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg);
        color: var(--fg);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: 0;
        width: var(--bg-size);
        height: var(--bg-size);
        top: calc(50% - var(--bg-size) / 2);
        left: calc(50% - var(--bg-size) / 2);
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'>\
<text x='40' y='40' font-size='50'>☭</text>\
<text x='120' y='120' font-size='50'>☭</text>\
</svg>");
        background-repeat: repeat;
        background-size: var(--emoji-size) var(--emoji-size);
      }
      body::after {
        background-position: calc(var(--emoji-size) / 2) calc(var(--emoji-size) / 2);
      }

      .wrap {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: clamp(24px, 6vh, 80px);
        padding-bottom: 24px;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        max-width: 720px;
        padding-inline: 12px;
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      /* ===============================
   BANDEAU DE TITRE
   =============================== */

      /* Un bandeau de revue plutôt qu'une étiquette : titre en romaine sur deux
   lignes, refermé par un filet rouge. Le rouge de la marque n'est plus un pavé
   plein derrière le titre — il tient dans ce filet, ce qui laisse la roue être
   la seule tache de couleur de la page. */
      .masthead {
        display: grid;
        justify-items: center;
        gap: 10px;
        text-align: center;
      }
      h1 {
        margin: 0;
        display: grid;
        gap: 2px;
        font-family: var(--serif);
        font-weight: 700;
        text-transform: uppercase;
        line-height: 1.02;
      }
      /* Deux lignes de tailles très différentes : c'est le contraste qui fait
   la une, pas la taille absolue. */
      .masthead__lead {
        font-size: clamp(15px, 3.6vw, 20px);
        letter-spacing: 0.14em;
      }
      .masthead__main {
        font-size: clamp(26px, 6.6vw, 38px);
        letter-spacing: 0.02em;
      }
      .masthead__rule {
        width: 54px;
        height: 3px;
        border-radius: 999px;
        background: var(--masthead-accent);
      }
      .board {
        background: var(--surface);
        border: 1px solid var(--ring);
        border-radius: 12px;
        padding: 8px;
        display: grid;
        gap: 8px;
        justify-items: center;
        max-width: 560px;
        box-sizing: border-box;
      }
      .wheel-area {
        position: relative;
        width: 100%;
        display: grid;
        place-items: center;
      }
      .pointer {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        z-index: 6;
        --w: 14px;
        --h: 22px;
        border-left: var(--w) solid transparent;
        border-right: var(--w) solid transparent;
        border-top: var(--h) solid var(--pointer);
      }
      canvas {
        width: clamp(250px, 80vw, 540px);
        aspect-ratio: 1/1;
        display: block;
        border-radius: 50%;
        background: var(--surface-alt);
        box-shadow: inset 0 0 0 5px var(--surface-inset);
      }
      .controls {
        display: grid;
        gap: 10px;
        justify-items: center;
        padding-block: 6px;
      }
      .legend {
        font-size: 12px;
        color: var(--legend);
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        z-index: 9999;
      }
      /* Rembourrage haut plus généreux plutôt qu'à droite : le bouton de fermeture
   loge dans cette bande, et le texte reste centré. Avec 48px à droite et 20 à
   gauche, il était décalé sur toute la hauteur de la bulle. */
      /* --bubble-close-room : la hauteur réservée en haut pour la croix, qui est
         en position absolue. Elle vaut sa position (10px) + sa taille + une
         marge. La règle tactile de buttons.css la fait passer de 34 à 44px, et
         la valeur figée qui traînait ici la laissait alors mordre sur le texte. */
      .bubble {
        position: relative;
        --bubble-close-room: 52px;
        max-width: min(92%, 620px);
        padding: var(--bubble-close-room) 20px 20px;
        border-radius: 14px;
        background: var(--bubble-bg);
        color: var(--bubble-fg);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        font-size: clamp(14px, 2.4vw, 20px);
        font-weight: 600;
        text-align: center;
        line-height: 1.35;
      }
      /* Positionnement seul : l'apparence des boutons vient de buttons.css. */
      .close {
        position: absolute;
        top: 10px;
        right: 10px;
      }

      @media (pointer: coarse) {
        .bubble {
          --bubble-close-room: 62px;
        }
      }

      /* Une grille plutôt qu'un flex-wrap : le nombre de pastilles par rangée est
   décidé, pas subi. En flex, les neuf boutons se cassaient en 6 + 3 selon la
   largeur du texte au-dessus. */
      /* 51 % des prélèvements n'ont ni recette ni année : la mention grisée
         évite une bulle réduite au seul intitulé, qu'on prenait pour un bug. */
      .result-unknown {
        opacity: 0.62;
        font-weight: 500;
      }
      .share-bar {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(9, auto);
        gap: 8px;
        justify-content: center;
      }
      .share-icon {
        width: 20px;
        height: 20px;
        display: block;
      }
      @media (max-width: 520px) {
        .share-bar {
          grid-template-columns: repeat(5, auto);
        }
      }
      /* Ajustement du cadre de résultat sur mobile */
      @media (max-width: 600px) {
        .overlay {
          display: flex;
          align-items: center;
          justify-content: center;
          padding-top: 0;
        }
        .bubble {
          max-width: 90%;
          max-width: 340px;
          padding: var(--bubble-close-room) 16px 16px;
          font-size: 15px;
          border-radius: 16px;
          margin: 0 auto;
          box-sizing: border-box;
        }
      }
      /* Empêche l'affichage initial de la fenêtre de résultat */
      .overlay[aria-hidden="true"] {
        display: none !important;
      }

      /* Boutons de retour utilisateur : posés sur la bulle, d'où la variante
     .btn-inverse dans le balisage. Ici, leur placement et leur poids.
     En grille : les deux libellés sont de longueurs très différentes, et un
     flex-wrap les disposait en escalier — le premier sur toute la largeur, le
     second centré dessous.
     Signaler une erreur reste une action tertiaire : deux pavés pleine largeur
     lui donnaient plus de présence qu'au résultat lui-même. */
      .feedback-buttons {
        margin-top: 16px;
        display: grid;
        gap: 6px;
      }

      .feedback-buttons .btn {
        min-height: 34px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0.72;
      }

      .feedback-buttons .btn:hover {
        opacity: 1;
      }

      @media (min-width: 560px) {
        .feedback-buttons {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* Empêche un fond plus grand que l’écran */
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }

      #feedbackForm {
        background: var(--modal-surface) !important;
        color: var(--modal-text);
      }

      #feedbackForm input,
      #feedbackForm textarea {
        background: var(--surface-alt);
        color: var(--modal-text);
        border: 1px solid var(--ring);
        border-radius: 8px;
        box-sizing: border-box;
      }

      #feedbackStatus {
        color: var(--modal-muted) !important;
      }

      .install-banner {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, calc(100% + 24px));
        width: min(calc(100vw - 24px), 520px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        box-sizing: border-box;
        border: 1px solid var(--install-border);
        border-radius: 16px;
        background: var(--install-surface);
        box-shadow: var(--install-shadow);
        z-index: 9500;
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.24s ease,
          opacity 0.24s ease;
      }

      .install-banner.is-visible {
        transform: translate(-50%, 0);
        opacity: 1;
        pointer-events: auto;
      }

      .install-banner__title {
        color: var(--install-title);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.2;
      }

      .install-banner__actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      @media (max-width: 520px) {
        .install-banner {
          gap: 10px;
          padding: 12px;
        }

        .install-banner__title {
          font-size: 14px;
        }
      }

      /* Feedback modal */
      .feedback-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 12000;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
      }
      .feedback-form {
        background: var(--modal-surface, #fff);
        color: var(--modal-text, #111);
        padding: 18px;
        border-radius: 10px;
        max-width: 520px;
        width: 92%;
        box-sizing: border-box;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .feedback-form h3 {
        margin: 0 0 8px;
      }
      .feedback-honeypot {
        display: none;
      }
      .feedback-label {
        display: block;
        margin-top: 8px;
      }
      .feedback-textarea {
        width: 100%;
        height: 120px;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 10px;
        font-size: 14px;
        resize: vertical;
      }
      .feedback-actions {
        margin-top: 14px;
      }
      .feedback-status {
        margin-top: 10px;
        font-size: 13px;
        color: var(--modal-muted, #333);
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="container">
        <header class="masthead">
          <h1>
            <span class="masthead__lead">La roue de</span>
            <span class="masthead__main">La servitude</span>
          </h1>
          <div class="masthead__rule" aria-hidden="true"></div>
        </header>
        <div class="board">
          <div class="wheel-area" id="wheelArea">
            <div class="pointer"></div>
            <!-- aria-label est réactualisé par updateCountInfo() (js/app.js) -->
            <canvas
              id="wheelCanvas"
              width="800"
              height="800"
              role="img"
              aria-label="Roue des taxes et prélèvements français"
            >
              La roue des taxes et prélèvements obligatoires français. Utilisez le bouton « Tourner
              la roue » pour tirer une entrée au sort.
            </canvas>
          </div>
          <div class="controls">
            <button id="spinBtn" class="btn btn-accent btn-lg btn-pill" type="button">
              Tourner la roue
            </button>
            <div class="legend" id="countInfo" role="status" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="installPrompt" class="install-banner" hidden aria-hidden="true">
      <div class="install-banner__title">Installer l'application</div>
      <div class="install-banner__actions">
        <button id="installPromptAction" class="btn btn-accent btn-sm btn-pill" type="button">
          Installer
        </button>
        <button
          id="installPromptClose"
          class="btn btn-icon btn-sm btn-secondary btn-close"
          type="button"
          aria-label="Fermer"
        ></button>
      </div>
    </div>

    <div id="overlay" class="overlay" aria-hidden="true">
      <!-- tabindex="-1" : js/app.js y place le focus à l'ouverture (openModal) -->
      <div
        class="bubble"
        role="dialog"
        aria-modal="true"
        aria-labelledby="overlayText"
        tabindex="-1"
      >
        <div id="overlayText" role="status" aria-live="polite"></div>
        <!-- `aria-label` sert à la fois de nom accessible et d'info-bulle (.btn-tip,
         buttons.css) : plus de `title` à garder synchronisé. -->
        <div class="share-bar" id="shareBar">
          <!-- Logos de marque repris du projet « Jours de retraite »
               (lemodelesocialfrancais.github.io/joursderetraite). Ils remplacent des
               glyphes dessinés à la main, dont plusieurs se devinaient mal.
               Certains sont tracés, d'autres pleins : chaque <svg> porte donc ses
               propres attributs plutôt qu'un jeu commun. -->
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="facebook"
            aria-label="Partager sur Facebook"
          >
            <svg
              class="share-icon"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="x"
            aria-label="Partager sur X / Twitter"
          >
            <svg
              class="share-icon"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="instagram"
            aria-label="Partager sur Instagram"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.7 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07a83 83 0 0 1-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.64-.07-4.85s.02-3.58.07-4.85c.15-3.23 1.67-4.77 4.92-4.92A84 84 0 0 1 12 2.16M12 0C8.74 0 8.33.01 7.05.07 2.7.27.27 2.7.07 7.05.01 8.33 0 8.75 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98 1.28.06 1.7.07 4.95.07s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.7.07-4.95s-.01-3.67-.07-4.95C23.73 2.7 21.3.27 16.95.07A84 84 0 0 0 12 0m0 5.84a6.16 6.16 0 1 0 0 12.32 6.16 6.16 0 0 0 0-12.32M12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8m6.4-11.84a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="linkedin"
            aria-label="Partager sur LinkedIn"
          >
            <svg
              class="share-icon"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6M2 9h4v12H2z"
              />
              <circle cx="4" cy="4" r="2" />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="snapchat"
            aria-label="Partager sur Snapchat"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12.2.8c1 0 4.35.27 5.94 3.81.52 1.2.4 3.22.3 4.85v.06l-.04.51q.11.09.4.1.46-.04 1.04-.31a1 1 0 0 1 .46-.1q.28 0 .5.09c.46.15.74.48.74.83q.03.68-1.21 1.17l-.34.12c-.45.14-1.14.36-1.34.81q-.14.34.12.87l.02.01c.06.14 1.52 3.48 4.79 4.02a.5.5 0 0 1 .42.5l-.05.23q-.35.85-3.14 1.27c-.06.1-.12.38-.17.57q-.04.26-.13.56-.12.4-.56.4h-.03a3 3 0 0 1-.53-.07 6 6 0 0 0-1.28-.14q-.45 0-.9.08c-.6.1-1.13.46-1.73.88-.86.6-1.83 1.29-3.3 1.29l-.18-.02h-.15a5.3 5.3 0 0 1-3.27-1.28c-.6-.42-1.11-.78-1.71-.89a7 7 0 0 0-.93-.07c-.54 0-.96.09-1.27.15a3 3 0 0 1-.54.07c-.38 0-.52-.22-.58-.42q-.1-.3-.14-.57c-.05-.18-.1-.5-.17-.57Q.4 19.27.06 18.4L0 18.17a.5.5 0 0 1 .42-.5c3.26-.55 4.73-3.89 4.8-4.03v-.03q.28-.52.13-.86c-.2-.44-.89-.66-1.34-.81l-.34-.12c-1.1-.44-1.26-.93-1.2-1.28.1-.47.68-.79 1.17-.79q.22 0 .38.08.64.3 1.1.3.36-.02.47-.11l-.04-.57c-.1-1.62-.23-3.65.3-4.84A6.3 6.3 0 0 1 11.73.8h.48z"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="tiktok"
            aria-label="Partager sur TikTok"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15.5 3a5.2 5.2 0 0 0 3 3.02V9a6 6 0 0 1-3.2-.9v6.18a5.3 5.3 0 1 1-5.3-5.3q.35 0 .7.06v2.86a2.52 2.52 0 1 0 1.86 2.42V3z"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="whatsapp"
            aria-label="Partager sur WhatsApp"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97s-.47-.14-.67.15-.76.97-.94 1.17-.34.22-.64.07-1.26-.46-2.4-1.47a9 9 0 0 1-1.64-2.06c-.18-.3-.02-.46.13-.6.13-.14.3-.35.44-.53s.2-.3.3-.5.05-.36-.03-.51-.66-1.62-.91-2.21c-.24-.58-.49-.5-.67-.51l-.57-.01c-.2 0-.52.07-.8.37-.26.3-1.03 1.02-1.03 2.48s1.06 2.88 1.21 3.08 2.1 3.2 5.08 4.48q1.04.44 1.7.63c.7.22 1.35.2 1.86.11.57-.08 1.76-.71 2-1.4s.26-1.3.18-1.42c-.07-.13-.27-.2-.57-.35m-5.42 7.4A10 10 0 0 1 7 20.42l-.36-.22-3.74.99 1-3.65-.23-.38a10 10 0 0 1-1.51-5.26 9.9 9.9 0 0 1 16.87-6.98 9.8 9.8 0 0 1 2.9 7 9.9 9.9 0 0 1-9.89 9.88m8.41-18.3a11.8 11.8 0 0 0-8.4-3.5 11.9 11.9 0 0 0-10.3 17.84L.05 24l6.31-1.65a12 12 0 0 0 5.69 1.44c6.55 0 11.89-5.33 11.9-11.89a11.8 11.8 0 0 0-3.49-8.41"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="telegram"
            aria-label="Partager sur Telegram"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="m2.12 11.08 19.04-7.35c.89-.34 1.66.21 1.38 1.51L19.3 20.51c-.24 1.14-.93 1.13-1.52.5l-4.24-3.93-2.04 1.97c-.23.22-.42.41-.85.41l.3-4.3 7.84-7.08c.34-.3-.08-.47-.53-.16l-9.68 6.1L4.4 12.7c-.9-.29-.92-.9.2-1.35z"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            id="copyText"
            aria-label="Copier le texte"
          >
            <svg
              class="share-icon"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path d="M4 16a2 2 0 0 1-2-2V4c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2" />
            </svg>
          </button>
        </div>
        <!-- Hors de #overlayText, qui est une zone aria-live : ces deux boutons y
             étaient injectés à chaque tirage, donc réannoncés avec le résultat.
             Ils viennent après le partage, qui est l'action attendue ici. -->
        <div class="feedback-buttons">
          <button id="btn-info" type="button" class="btn btn-inverse btn-sm">
            Donner un complément d'information
          </button>
          <button id="btn-error" type="button" class="btn btn-inverse btn-sm">
            Signaler une erreur
          </button>
        </div>
        <button
          id="overlayClose"
          class="close btn btn-icon btn-sm btn-pill btn-inverse btn-close"
          type="button"
          aria-label="Fermer"
        ></button>
      </div>
    </div>

    <!-- Modal feedback -->
    <div
      id="feedbackModal"
      class="feedback-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="feedbackTitle"
    >
      <form id="feedbackForm" class="feedback-form">
        <h3 id="feedbackTitle">Donner un complément d'information</h3>
        <input type="hidden" id="formResult" name="resultText" value="" />
        <input type="hidden" id="formType" name="type" value="info" />
        <input
          type="text"
          name="honeypot"
          id="honeypot"
          class="feedback-honeypot"
          autocomplete="off"
          tabindex="-1"
          aria-hidden="true"
        />
        <label class="feedback-label">
          Votre message
          <textarea
            id="formMessage"
            name="userMessage"
            required
            class="feedback-textarea"
          ></textarea>
        </label>
        <div class="feedback-actions btn-row btn-row--end">
          <button type="button" id="closeFeedback" class="btn btn-secondary">Annuler</button>
          <button type="submit" class="btn btn-primary">Envoyer</button>
        </div>
        <div id="feedbackStatus" class="feedback-status" role="status" aria-live="polite"></div>
      </form>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
