<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="La roue de la servitude - Découvrez les 371 taxes et prélèvements obligatoires français de manière ludique. Une application web progressive (PWA) utilisable hors ligne."
    />
    <title>La roue de la servitude</title>

    <!-- 🚀 Préchargement ultra-agressif des ressources critiques -->
    <link
      rel="preload"
      href="data/entries-light.json"
      as="fetch"
      type="application/json"
      crossorigin="anonymous"
    />
    <link rel="preload" href="images/center3.avif" as="image" type="image/avif" />

    <!-- Favicons (nouveaux fichiers dans le dossier /icons) -->
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

    <!-- Icônes pour PWA (Progressive Web Apps) -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png" />

    <!-- Apple PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="La roue de la servitude" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="site.webmanifest" />

    <!-- Meta pour les réseaux sociaux (Open Graph / Twitter) -->
    <meta property="og:image" content="icons/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="icons/og-image.png" />

    <!-- Styles critiques (priorité haute) -->
    <!-- buttons.css est bloquant, contrairement aux deux suivants : il habille le
     bouton « Tourner la roue », visible d'emblée. Chargé en différé, ce bouton
     apparaîtrait d'abord nu. -->
    <link rel="stylesheet" href="buttons.css" />
    <link rel="stylesheet" href="bills.css" media="print" onload="this.media = 'all'" />
    <link rel="stylesheet" href="menu.css" media="print" onload="this.media = 'all'" />
    <noscript>
      <link rel="stylesheet" href="bills.css" />
      <link rel="stylesheet" href="menu.css" />
    </noscript>

    <style>
      :root {
        --bg: #f7f7f7;
        --fg: #111;
        --ring: #e5e7eb;
        --surface: #fff;
        --surface-alt: #fafafa;
        --surface-inset: #f0f0f0;
        --button-bg: #111;
        --button-fg: #fff;
        --legend: #666;
        --pointer: #111;
        --bubble-bg: #111;
        --bubble-fg: #fff;
        --tooltip-bg: #111;
        --tooltip-fg: #fff;
        --modal-surface: #fff;
        --modal-text: #111;
        --modal-muted: #333;
        --install-surface: #fff;
        --install-border: rgba(17, 17, 17, 0.12);
        --install-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
        --install-title: #111;
        --emoji-size: 80px;
        --bg-size: 200vw;
        /* Ambre : lisible aussi bien sur les fonds clairs que sur la bulle sombre */
        --focus: #f59e0b;
      }

      :root[data-theme="dark"] {
        --bg: #0f1115;
        --fg: #f3f4f6;
        --ring: #2a2f3a;
        --surface: #151922;
        --surface-alt: #10151d;
        --surface-inset: #242b38;
        --button-bg: #f3f4f6;
        --button-fg: #101317;
        --legend: #a1a1aa;
        --pointer: #f3f4f6;
        --bubble-bg: #f3f4f6;
        --bubble-fg: #101317;
        --tooltip-bg: #f3f4f6;
        --tooltip-fg: #101317;
        --modal-surface: #151922;
        --modal-text: #f3f4f6;
        --modal-muted: #cbd5e1;
        --install-surface: #151922;
        --install-border: rgba(243, 244, 246, 0.12);
        --install-shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
        --install-title: #f3f4f6;
        --focus: #f59e0b;
      }

      /* ===============================
   ACCESSIBILITÉ
   =============================== */

      /* Aucun style de focus n'existait : la navigation au clavier était invisible.
   :focus-visible ne se déclenche qu'au clavier, la souris reste inchangée. */
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      /* .bubble reçoit le focus par programme à l'ouverture du dialogue (openModal
   dans js/app.js) : pas de contour à afficher pour autant. */
      .bubble:focus,
      .bubble:focus-visible {
        outline: none;
      }

      /* Respect de la préférence système « mouvement réduit ». Couvre aussi
   menu.css et bills.css, chargés dans ce même document. La rotation de la
   roue et l'effet billets, pilotés en JS, sont traités dans js/app.js. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* 1️⃣ Tout hérite de la police principale */
      *,
      *::before,
      *::after {
        font-family: inherit;
      }

      /* 2️⃣ Police système + lissage */
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: contain; /* bloque l'effet "rebond" sur mobile */
        touch-action: none; /* empêche le scroll tactile */
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg);
        color: var(--fg);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: 0;
        width: var(--bg-size);
        height: var(--bg-size);
        top: calc(50% - var(--bg-size) / 2);
        left: calc(50% - var(--bg-size) / 2);
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'>\
<text x='40' y='40' font-size='50'>☭</text>\
<text x='120' y='120' font-size='50'>☭</text>\
</svg>");
        background-repeat: repeat;
        background-size: var(--emoji-size) var(--emoji-size);
      }
      body::after {
        background-position: calc(var(--emoji-size) / 2) calc(var(--emoji-size) / 2);
      }

      .wrap {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: clamp(24px, 6vh, 80px);
        padding-bottom: 24px;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        max-width: 720px;
        padding-inline: 12px;
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(18px, 2.6vw, 22px);
        font-weight: 700;
        text-transform: uppercase;
        text-align: center;
      }
      h1 .highlight {
        background: #c00;
        color: #fff;
        padding: 4px 10px;
        border-radius: 6px;
      }
      .board {
        background: var(--surface);
        border: 1px solid var(--ring);
        border-radius: 12px;
        padding: 8px;
        display: grid;
        gap: 8px;
        justify-items: center;
        max-width: 560px;
        box-sizing: border-box;
      }
      .wheel-area {
        position: relative;
        width: 100%;
        display: grid;
        place-items: center;
      }
      .pointer {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        z-index: 6;
        --w: 14px;
        --h: 22px;
        border-left: var(--w) solid transparent;
        border-right: var(--w) solid transparent;
        border-top: var(--h) solid var(--pointer);
      }
      canvas {
        width: clamp(250px, 80vw, 540px);
        aspect-ratio: 1/1;
        display: block;
        border-radius: 50%;
        background: var(--surface-alt);
        box-shadow: inset 0 0 0 5px var(--surface-inset);
      }
      .controls {
        display: grid;
        gap: 10px;
        justify-items: center;
        padding-block: 6px;
      }
      .legend {
        font-size: 12px;
        color: var(--legend);
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        z-index: 9999;
      }
      /* Rembourrage haut plus généreux plutôt qu'à droite : le bouton de fermeture
   loge dans cette bande, et le texte reste centré. Avec 48px à droite et 20 à
   gauche, il était décalé sur toute la hauteur de la bulle. */
      .bubble {
        position: relative;
        max-width: min(92%, 620px);
        padding: 46px 20px 20px;
        border-radius: 14px;
        background: var(--bubble-bg);
        color: var(--bubble-fg);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        font-size: clamp(14px, 2.4vw, 20px);
        font-weight: 600;
        text-align: center;
        line-height: 1.35;
      }
      /* Positionnement seul : l'apparence des boutons vient de buttons.css. */
      .close {
        position: absolute;
        top: 10px;
        right: 10px;
      }

      /* Une grille plutôt qu'un flex-wrap : le nombre de pastilles par rangée est
   décidé, pas subi. En flex, les neuf boutons se cassaient en 6 + 3 selon la
   largeur du texte au-dessus. */
      .share-bar {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(9, auto);
        gap: 8px;
        justify-content: center;
      }
      .share-icon {
        width: 20px;
        height: 20px;
        display: block;
      }
      @media (max-width: 520px) {
        .share-bar {
          grid-template-columns: repeat(5, auto);
        }
      }
      /* Ajustement du cadre de résultat sur mobile */
      @media (max-width: 600px) {
        .overlay {
          display: flex;
          align-items: center;
          justify-content: center;
          padding-top: 0;
        }
        .bubble {
          max-width: 90%;
          max-width: 340px;
          padding: 42px 16px 16px;
          font-size: 15px;
          border-radius: 16px;
          margin: 0 auto;
          box-sizing: border-box;
        }
      }
      /* Empêche l'affichage initial de la fenêtre de résultat */
      .overlay[aria-hidden="true"] {
        display: none !important;
      }

      /* Boutons de retour utilisateur : posés sur la bulle, d'où la variante
     .btn-inverse dans le balisage. Ici, uniquement leur placement.
     En grille : les deux libellés sont de longueurs très différentes, et un
     flex-wrap les disposait en escalier — le premier sur toute la largeur, le
     second centré dessous. */
      .feedback-buttons {
        margin-top: 18px;
        display: grid;
        gap: 8px;
      }

      @media (min-width: 560px) {
        .feedback-buttons {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* Empêche un fond plus grand que l’écran */
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }

      #feedbackForm {
        background: var(--modal-surface) !important;
        color: var(--modal-text);
      }

      #feedbackForm input,
      #feedbackForm textarea {
        background: var(--surface-alt);
        color: var(--modal-text);
        border: 1px solid var(--ring);
        border-radius: 8px;
        box-sizing: border-box;
      }

      #feedbackStatus {
        color: var(--modal-muted) !important;
      }

      .install-banner {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, calc(100% + 24px));
        width: min(calc(100vw - 24px), 520px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        box-sizing: border-box;
        border: 1px solid var(--install-border);
        border-radius: 16px;
        background: var(--install-surface);
        box-shadow: var(--install-shadow);
        z-index: 9500;
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.24s ease,
          opacity 0.24s ease;
      }

      .install-banner.is-visible {
        transform: translate(-50%, 0);
        opacity: 1;
        pointer-events: auto;
      }

      .install-banner__title {
        color: var(--install-title);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.2;
      }

      .install-banner__actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      @media (max-width: 520px) {
        .install-banner {
          gap: 10px;
          padding: 12px;
        }

        .install-banner__title {
          font-size: 14px;
        }
      }

      /* Feedback modal */
      .feedback-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 12000;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
      }
      .feedback-form {
        background: var(--modal-surface, #fff);
        color: var(--modal-text, #111);
        padding: 18px;
        border-radius: 10px;
        max-width: 520px;
        width: 92%;
        box-sizing: border-box;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .feedback-form h3 {
        margin: 0 0 8px;
      }
      .feedback-honeypot {
        display: none;
      }
      .feedback-label {
        display: block;
        margin-top: 8px;
      }
      .feedback-textarea {
        width: 100%;
        height: 120px;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 10px;
        font-size: 14px;
        resize: vertical;
      }
      .feedback-actions {
        margin-top: 14px;
      }
      .feedback-status {
        margin-top: 10px;
        font-size: 13px;
        color: var(--modal-muted, #333);
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="container">
        <h1><span class="highlight">La roue de la servitude</span></h1>
        <div class="board">
          <div class="wheel-area" id="wheelArea">
            <div class="pointer"></div>
            <!-- aria-label est réactualisé par updateCountInfo() (js/app.js) -->
            <canvas
              id="wheelCanvas"
              width="800"
              height="800"
              role="img"
              aria-label="Roue des taxes et prélèvements français"
            >
              La roue des taxes et prélèvements obligatoires français. Utilisez le bouton « Tourner
              la roue » pour tirer une entrée au sort.
            </canvas>
          </div>
          <div class="controls">
            <button id="spinBtn" class="btn btn-accent btn-lg btn-pill" type="button">
              Tourner la roue
            </button>
            <div class="legend" id="countInfo" role="status" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="installPrompt" class="install-banner" hidden aria-hidden="true">
      <div class="install-banner__title">Installer l'application</div>
      <div class="install-banner__actions">
        <button id="installPromptAction" class="btn btn-accent btn-sm btn-pill" type="button">
          Installer
        </button>
        <button
          id="installPromptClose"
          class="btn btn-icon btn-sm btn-secondary btn-close"
          type="button"
          aria-label="Fermer"
        ></button>
      </div>
    </div>

    <div id="overlay" class="overlay" aria-hidden="true">
      <!-- tabindex="-1" : js/app.js y place le focus à l'ouverture (openModal) -->
      <div
        class="bubble"
        role="dialog"
        aria-modal="true"
        aria-labelledby="overlayText"
        tabindex="-1"
      >
        <div id="overlayText" role="status" aria-live="polite"></div>
        <!-- `aria-label` sert à la fois de nom accessible et d'info-bulle (.btn-tip,
         buttons.css) : plus de `title` à garder synchronisé. -->
        <div class="share-bar" id="shareBar">
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="facebook"
            aria-label="Partager sur Facebook"
          >
            <svg
              class="share-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"

              <path
                d="M17 3h-2.5A4.5 4.5 0 0 0 10 7.5V10H7.5v3.5H10V21h3.5v-7.5h2.6l.6-3.5h-3.2V7.5a1 1 0 0 1 1-1H17z"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="x"
            aria-label="Partager sur X / Twitter"
          >
            <svg
              class="share-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 4l7 8.6M4 20l6.6-7.6M20 4l-6.6 7.6M20 20l-7-8.6" />
              <path d="M4 4h2.6l13.4 16h-2.6z" />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="instagram"
            aria-label="Partager sur Instagram"
          >
            <svg
              class="share-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="5.2" />
              <circle cx="12" cy="12" r="4" />
              <path d="M17 7h.01" />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="linkedin"
            aria-label="Partager sur LinkedIn"
          >
            <svg
              class="share-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="9" width="3.6" height="12" rx="0.6" />
              <circle cx="4.8" cy="4.6" r="1.8" />
              <path d="M11 21v-9" />
              <path d="M11 15.2a3.2 3.2 0 0 1 6.4 0V21" />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="snapchat"
            aria-label="Partager sur Snapchat"
          >
            <svg
              class="share-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12 3.5c2.7 0 4.2 2 4.1 4.4 0 .8-.1 1.4.1 1.8.2.4.9.3 1.3.2.4-.1.6.5.2.8-.4.3-1.3.4-1.4.9-.1.4 1 2.2 2.7 2.8.3.1.2.6-.1.6-.9.3-1.6.2-1.8.6-.1.3-.1.6-.5.6-.6 0-1.1-.2-2-.1-.9.2-1.5 1.2-2.6 1.2s-1.7-1-2.6-1.2c-.9-.2-1.4.1-2 .1-.4 0-.4-.3-.5-.6-.2-.4-.9-.3-1.8-.6-.3 0-.4-.5-.1-.6 1.7-.6 2.8-2.4 2.7-2.8-.1-.5-1-.6-1.4-.9-.4-.3-.2-.9.2-.8.4.1 1.1.2 1.3-.2.2-.4.1-1 .1-1.8C7.8 5.5 9.3 3.5 12 3.5z"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="tiktok"
            aria-label="Partager sur TikTok"
          >
            <svg
              class="share-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9.5 20.5a4 4 0 1 0-4-4" />
              <path d="M13.5 3v11.5" />
              <path d="M13.5 3c.4 2.6 2.3 4.4 5 4.6" />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="whatsapp"
            aria-label="Partager sur WhatsApp"
          >
            <svg
              class="share-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.5L3.5 20.5l1.4-4.4A8.5 8.5 0 1 1 20.5 11.6z"
              />
              <path
                d="M9 8.6c.4-.1.7 0 .9.4l.7 1.3c.1.3.1.5-.1.8l-.4.5c-.2.2-.2.4-.1.6a6 6 0 0 0 2.3 2.3c.2.1.4.1.6-.1l.5-.4c.3-.2.5-.2.8-.1l1.3.7c.4.2.5.5.4.9-.2.9-1.1 1.4-2 1.3-3-.4-5.6-3-6-6-.1-.9.4-1.8 1.3-2z"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            data-platform="telegram"
            aria-label="Partager sur Telegram"
          >
            <svg
              class="share-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 4L3 11l5.5 2z" />
              <path d="M21 4l-3 16-6.5-5.6L8.5 13z" />
              <path d="M8.5 13v5l3-3.4" />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-pill btn-inverse btn-tip"
            type="button"
            id="copyText"
            aria-label="Copier le texte"
          >
            <svg
              class="share-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="9" y="9" width="12" height="12" rx="2.4" />
              <path
                d="M5 15H4.4A2.4 2.4 0 0 1 2 12.6V4.4A2.4 2.4 0 0 1 4.4 2h8.2A2.4 2.4 0 0 1 15 4.4V5"
              />
            </svg>
          </button>
        </div>
        <button
          id="overlayClose"
          class="close btn btn-icon btn-sm btn-pill btn-inverse btn-close"
          type="button"
          aria-label="Fermer"
        ></button>
      </div>
    </div>

    <!-- Modal feedback -->
    <div
      id="feedbackModal"
      class="feedback-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="feedbackTitle"
    >
      <form id="feedbackForm" class="feedback-form">
        <h3 id="feedbackTitle">Donner un complément d'information</h3>
        <input type="hidden" id="formResult" name="resultText" value="" />
        <input type="hidden" id="formType" name="type" value="info" />
        <input
          type="text"
          name="honeypot"
          id="honeypot"
          class="feedback-honeypot"
          autocomplete="off"
          tabindex="-1"
          aria-hidden="true"
        />
        <label class="feedback-label">
          Votre message
          <textarea
            id="formMessage"
            name="userMessage"
            required
            class="feedback-textarea"
          ></textarea>
        </label>
        <div class="feedback-actions btn-row btn-row--end">
          <button type="button" id="closeFeedback" class="btn btn-secondary">Annuler</button>
          <button type="submit" class="btn btn-primary">Envoyer</button>
        </div>
        <div id="feedbackStatus" class="feedback-status" role="status" aria-live="polite"></div>
      </form>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
