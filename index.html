<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="La roue de la servitude - Découvrez les 371 taxes et prélèvements obligatoires français de manière ludique. Une application web progressive (PWA) utilisable hors ligne." />
<title>La roue de la servitude</title>

<!-- 🚀 Préchargement ultra-agressif des ressources critiques -->
<link rel="preload" href="data/entries-light.json" as="fetch" type="application/json" crossorigin="anonymous">
<link rel="preload" href="images/center3.avif" as="image" type="image/avif">
  
<!-- Favicons (nouveaux fichiers dans le dossier /icons) -->
<link rel="icon" href="icons/favicon.ico" type="image/x-icon">

<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

<!-- Icônes pour PWA (Progressive Web Apps) -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">

<!-- Apple PWA support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="La roue de la servitude">

<!-- Manifest PWA -->
<link rel="manifest" href="site.webmanifest">

<!-- Meta pour les réseaux sociaux (Open Graph / Twitter) -->
<meta property="og:image" content="icons/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="icons/og-image.png">

<!-- Styles critiques (priorité haute) -->
<!-- buttons.css est bloquant, contrairement aux deux suivants : il habille le
     bouton « Tourner la roue », visible d'emblée. Chargé en différé, ce bouton
     apparaîtrait d'abord nu. -->
<link rel="stylesheet" href="buttons.css">
<link rel="stylesheet" href="bills.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="menu.css" media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="bills.css">
  <link rel="stylesheet" href="menu.css">
</noscript>

<style>
:root{
  --bg:#f7f7f7; --fg:#111; --ring:#e5e7eb;
  --surface:#fff; --surface-alt:#fafafa; --surface-inset:#f0f0f0;
  --button-bg:#111; --button-fg:#fff; --legend:#666; --pointer:#111;
  --bubble-bg:#111; --bubble-fg:#fff;
  --tooltip-bg:#111; --tooltip-fg:#fff;
  --modal-surface:#fff; --modal-text:#111; --modal-muted:#333;
  --install-surface:#fff; --install-border:rgba(17,17,17,0.12); --install-shadow:0 18px 40px rgba(0,0,0,0.18);
  --install-title:#111;
  --emoji-size:80px; --bg-size:200vw;
  /* Ambre : lisible aussi bien sur les fonds clairs que sur la bulle sombre */
  --focus:#f59e0b;
}

:root[data-theme="dark"]{
  --bg:#0f1115; --fg:#f3f4f6; --ring:#2a2f3a;
  --surface:#151922; --surface-alt:#10151d; --surface-inset:#242b38;
  --button-bg:#f3f4f6; --button-fg:#101317; --legend:#a1a1aa; --pointer:#f3f4f6;
  --bubble-bg:#f3f4f6; --bubble-fg:#101317;
  --tooltip-bg:#f3f4f6; --tooltip-fg:#101317;
  --modal-surface:#151922; --modal-text:#f3f4f6; --modal-muted:#cbd5e1;
  --install-surface:#151922; --install-border:rgba(243,244,246,0.12); --install-shadow:0 18px 40px rgba(0,0,0,0.42);
  --install-title:#f3f4f6;
  --focus:#f59e0b;
}

/* ===============================
   ACCESSIBILITÉ
   =============================== */

/* Aucun style de focus n'existait : la navigation au clavier était invisible.
   :focus-visible ne se déclenche qu'au clavier, la souris reste inchangée. */
:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
}

/* .bubble reçoit le focus par programme à l'ouverture du dialogue (openModal
   dans js/app.js) : pas de contour à afficher pour autant. */
.bubble:focus,
.bubble:focus-visible{
  outline:none;
}

/* Respect de la préférence système « mouvement réduit ». Couvre aussi
   menu.css et bills.css, chargés dans ce même document. La rotation de la
   roue et l'effet billets, pilotés en JS, sont traités dans js/app.js. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }
}
  
/* 1️⃣ Tout hérite de la police principale */
*, *::before, *::after {
  font-family: inherit;
}

/* 2️⃣ Police système + lissage */
html,body {
  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  overscroll-behavior: contain; /* bloque l'effet "rebond" sur mobile */
  touch-action: none; /* empêche le scroll tactile */
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: var(--bg);
  color: var(--fg);
}

body::before,body::after{
  content:"";position:fixed;z-index:0;width:var(--bg-size);height:var(--bg-size);
  top:calc(50% - var(--bg-size)/2);left:calc(50% - var(--bg-size)/2);
  pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'>\
<text x='40' y='40' font-size='50'>☭</text>\
<text x='120' y='120' font-size='50'>☭</text>\
</svg>");
  background-repeat:repeat;background-size:var(--emoji-size) var(--emoji-size);
}
body::after{background-position:calc(var(--emoji-size)/2) calc(var(--emoji-size)/2);}

  
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;
padding-top:clamp(24px,6vh,80px);padding-bottom:24px;box-sizing:border-box;}
.container{width:100%;max-width:720px;padding-inline:12px;display:grid;gap:12px;justify-items:center;}
h1{margin:0;font-size:clamp(18px,2.6vw,22px);font-weight:700;text-transform:uppercase;text-align:center;}
h1 .highlight{background:#c00;color:#fff;padding:4px 10px;border-radius:6px;}
.board{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:8px;display:grid;gap:8px;justify-items:center;max-width:560px;box-sizing:border-box;}
.wheel-area{position:relative;width:100%;display:grid;place-items:center;}
.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;z-index:6;
--w:14px;--h:22px;border-left:var(--w) solid transparent;border-right:var(--w) solid transparent;border-top:var(--h) solid var(--pointer);}
canvas{width:clamp(250px,80vw,540px);aspect-ratio:1/1;display:block;border-radius:50%;background:var(--surface-alt);box-shadow:inset 0 0 0 5px var(--surface-inset);}
.controls{display:grid;gap:10px;justify-items:center;padding-block:6px;}
.legend{font-size:12px;color:var(--legend);}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);z-index:9999;}
.bubble{position:relative;max-width:92%;padding:20px 48px 20px 20px;border-radius:14px;background:var(--bubble-bg);color:var(--bubble-fg);
box-shadow:0 8px 24px rgba(0,0,0,0.25);font-size:clamp(14px,2.4vw,20px);font-weight:600;text-align:center;line-height:1.35;}
/* Positionnement seul : l'apparence des boutons vient de buttons.css. */
.close{position:absolute;top:10px;right:10px;}
.share-bar{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
/* Ajustement du cadre de résultat sur mobile */
@media (max-width: 600px) {
  .overlay {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 0;
  }
  .bubble {
    max-width: 90%;
    max-width: 340px;
    padding: 16px 36px 16px 16px;
    font-size: 15px;
    border-radius: 16px;
    margin: 0 auto;
    box-sizing: border-box;
  }
}
  /* Empêche l'affichage initial de la fenêtre de résultat */
.overlay[aria-hidden="true"] {
  display: none !important;
}

  /* Boutons de retour utilisateur : posés sur la bulle, d'où la variante
     .btn-inverse dans le balisage. Ici, uniquement leur placement. */
.feedback-buttons {
  margin-top: 16px;
}

/* Empêche un fond plus grand que l’écran */
body {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
}

#feedbackForm {
  background: var(--modal-surface) !important;
  color: var(--modal-text);
}

#feedbackForm input,
#feedbackForm textarea {
  background: var(--surface-alt);
  color: var(--modal-text);
  border: 1px solid var(--ring);
  border-radius: 8px;
  box-sizing: border-box;
}

#feedbackStatus {
  color: var(--modal-muted) !important;
}

.install-banner{
  position:fixed;
  left:50%;
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  transform:translate(-50%, calc(100% + 24px));
  width:min(calc(100vw - 24px), 520px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px;
  box-sizing:border-box;
  border:1px solid var(--install-border);
  border-radius:16px;
  background:var(--install-surface);
  box-shadow:var(--install-shadow);
  z-index:9500;
  opacity:0;
  pointer-events:none;
  transition:transform 0.24s ease, opacity 0.24s ease;
}

.install-banner.is-visible{
  transform:translate(-50%, 0);
  opacity:1;
  pointer-events:auto;
}

.install-banner__title{
  color:var(--install-title);
  font-size:15px;
  font-weight:700;
  line-height:1.2;
}

.install-banner__actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

@media (max-width: 520px) {
  .install-banner{
    gap:10px;
    padding:12px;
  }

  .install-banner__title{
    font-size:14px;
  }
}

/* Feedback modal */
.feedback-modal{
  display:none;position:fixed;inset:0;z-index:12000;
  align-items:center;justify-content:center;background:rgba(0,0,0,0.45);
}
.feedback-form{
  background:var(--modal-surface,#fff);color:var(--modal-text,#111);
  padding:18px;border-radius:10px;max-width:520px;width:92%;box-sizing:border-box;
  box-shadow:0 18px 40px rgba(0,0,0,0.35);
}
.feedback-form h3{margin:0 0 8px;}
.feedback-honeypot{display:none;}
.feedback-label{display:block;margin-top:8px;}
.feedback-textarea{width:100%;height:120px;box-sizing:border-box;margin-top:4px;padding:10px;font-size:14px;resize:vertical;}
.feedback-actions{margin-top:14px;}
.feedback-status{margin-top:10px;font-size:13px;color:var(--modal-muted,#333);display:none;}

</style>
</head>
<body>
<div class="wrap">
  <div class="container">
    <h1><span class="highlight">La roue de la servitude</span></h1>
    <div class="board">
      <div class="wheel-area" id="wheelArea">
        <div class="pointer"></div>
        <!-- aria-label est réactualisé par updateCountInfo() (js/app.js) -->
        <canvas id="wheelCanvas" width="800" height="800" role="img"
                aria-label="Roue des taxes et prélèvements français">
          La roue des taxes et prélèvements obligatoires français. Utilisez le
          bouton « Tourner la roue » pour tirer une entrée au sort.
        </canvas>
      </div>
      <div class="controls">
        <button id="spinBtn" class="btn btn-accent btn-lg btn-pill" type="button">Tourner la roue</button>
        <div class="legend" id="countInfo" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<div id="installPrompt" class="install-banner" hidden aria-hidden="true">
  <div class="install-banner__title">Installer l'application</div>
  <div class="install-banner__actions">
    <button id="installPromptAction" class="btn btn-accent btn-sm btn-pill" type="button">Installer</button>
    <button id="installPromptClose" class="btn btn-icon btn-sm btn-secondary btn-close" type="button" aria-label="Fermer"></button>
  </div>
</div>

<div id="overlay" class="overlay" aria-hidden="true">
  <!-- tabindex="-1" : js/app.js y place le focus à l'ouverture (openModal) -->
  <div class="bubble" role="dialog" aria-modal="true" aria-labelledby="overlayText" tabindex="-1">
    <div id="overlayText" role="status" aria-live="polite"></div>
    <!-- `aria-label` sert à la fois de nom accessible et d'info-bulle (.btn-tip,
         buttons.css) : plus de `title` à garder synchronisé. -->
    <div class="share-bar" id="shareBar">
      <button class="btn btn-icon btn-pill btn-inverse btn-tip" type="button" data-platform="facebook" aria-label="Partager sur Facebook">📘</button>
      <button class="btn btn-icon btn-pill btn-inverse btn-tip" type="button" data-platform="x" aria-label="Partager sur X / Twitter">🐦</button>
      <button class="btn btn-icon btn-pill btn-inverse btn-tip" type="button" data-platform="instagram" aria-label="Partager sur Instagram">📸</button>
      <button class="btn btn-icon btn-pill btn-inverse btn-tip" type="button" data-platform="linkedin" aria-label="Partager sur LinkedIn">💼</button>
      <button class="btn btn-icon btn-pill btn-inverse btn-tip" type="button" data-platform="snapchat" aria-label="Partager sur Snapchat">👻</button>
      <button class="btn btn-icon btn-pill btn-inverse btn-tip" type="button" data-platform="tiktok" aria-label="Partager sur TikTok">🎵</button>
      <button class="btn btn-icon btn-pill btn-inverse btn-tip" type="button" data-platform="whatsapp" aria-label="Partager sur WhatsApp">💬</button>
      <button class="btn btn-icon btn-pill btn-inverse btn-tip" type="button" data-platform="telegram" aria-label="Partager sur Telegram">📨</button>
      <button class="btn btn-icon btn-pill btn-inverse btn-tip" type="button" id="copyText" aria-label="Copier le texte">📋</button>
    </div>
    <button id="overlayClose" class="close btn btn-icon btn-sm btn-pill btn-inverse btn-close" type="button" aria-label="Fermer"></button>
  </div>
</div>

<!-- Modal feedback -->
<div id="feedbackModal" class="feedback-modal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
  <form id="feedbackForm" class="feedback-form">
    <h3 id="feedbackTitle">Donner un complément d'information</h3>
    <input type="hidden" id="formResult" name="resultText" value="">
    <input type="hidden" id="formType" name="type" value="info">
    <input type="text" name="honeypot" id="honeypot" class="feedback-honeypot" autocomplete="off" tabindex="-1" aria-hidden="true">
    <label class="feedback-label">
      Votre message
      <textarea id="formMessage" name="userMessage" required class="feedback-textarea"></textarea>
    </label>
    <div class="feedback-actions btn-row btn-row--end">
      <button type="button" id="closeFeedback" class="btn btn-secondary">Annuler</button>
      <button type="submit" class="btn btn-primary">Envoyer</button>
    </div>
    <div id="feedbackStatus" class="feedback-status" role="status" aria-live="polite"></div>
  </form>
</div>

<script type="module" src="./js/app.js"></script>


</body>
</html>
