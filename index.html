    <style>
      :root {
        --bg: #f7f7f7;
        --fg: #111;
        --ring: #e5e7eb;
        --surface: #fff;
        --surface-alt: #fafafa;
        --surface-inset: #f0f0f0;
        --button-bg: #111;
        --button-fg: #fff;
        --legend: #666;
        --pointer: #111;
        --tooltip-bg: #111;
        --tooltip-fg: #fff;
        --modal-surface: #fff;
        --modal-text: #111;
        --modal-muted: #333;
        --install-surface: #fff;
        --install-border: rgba(17, 17, 17, 0.12);
        --install-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
        --install-title: #111;
        --emoji-size: 80px;
        --bg-size: 200vw;
        /* Hauteur de la barre d'onglets du bas (menu.css). Elle est déclarée
           ici, dans le CSS bloquant, et non dans menu.css qui est chargé en
           différé : la page doit réserver la place de la barre dès le premier
           rendu, sinon le bouton « Tourner la roue » sursaute quand elle
           apparaît. La marge du menu système iOS s'y ajoute. */
        --tabbar-h: 62px;
        --tabbar-room: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
        /* Hauteur réservée à la bannière d'installation quand elle est affichée
           (sa hauteur propre, plus l'espace qui la sépare du reste). */
        --install-room: 84px;
        /* Taille de la roue : la largeur voulue, puis un plafond en hauteur.
           Ce plafond est la place qui reste une fois la carte de résultat
           servie — et cette place lui est réservée dès le premier rendu, même
           si aucun tirage n'a eu lieu. C'est ce qui donne à la roue exactement
           la même taille avant et après un tirage : elle ne se resserre plus à
           l'apparition de la carte. */
        --wheel-size: clamp(250px, 86vw, 540px);
        /* Hauteur réservée à la carte. Mesurée sur les 371 intitulés du jeu à
           la largeur d'un téléphone : 224 px suffisent à la moitié d'entre eux,
           244 aux neuf dixièmes, 264 à dix-neuf sur vingt. C'est cette dernière
           valeur — au-delà, les quelques noms à rallonge font défiler le texte
           de la carte, sans ascenseur visible, et la roue ne bouge toujours
           pas. La couvrir jusqu'au plus long (301 px) aurait coûté 40 px de
           roue à tout le monde pour cinq pour cent des tirages. */
        --card-room: 264px;
        /* Tout le reste de la colonne : marge haute, bandeau de titre, écart
           entre la roue et la carte, marge basse et barre d'onglets. */
        --column-room: calc(117px + var(--tabbar-room));
        /* La première déclaration est le repli des navigateurs sans `svh`. */
        --wheel-cap: 52vh;
        --wheel-cap: min(52svh, calc(100svh - var(--card-room) - var(--column-room)));
        /* La trame de fond, une image par thème. Le SVG est un document
           indépendant : `currentColor` n'y a pas cours et son glyphe est noir
           par défaut, ce qui l'éteignait sur le fond sombre. La couleur est donc
           écrite dans son `fill` — et une retouche du motif est à reporter sur
           les deux valeurs. */
        --pattern-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160' fill='%23111'><text x='40' y='40' font-size='50'>☭</text><text x='120' y='120' font-size='50'>☭</text></svg>");
        /* Ambre : lisible sur les fonds clairs comme sur les fonds sombres */
        --focus: #f59e0b;
        /* Romaine du bandeau de titre. Pile entièrement système : aucune police
           n'est téléchargée, l'application reste complète hors ligne dès le
           premier chargement (cf. le refus de toute ressource tierce). */
        --serif:
          "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia,
          "Times New Roman", serif;
        --masthead-accent: #c00;
      }

      /* La bannière d'installation prend sa place dans la colonne : la roue lui
         rend cette hauteur, faute de quoi c'est la carte qui perdrait le tiers
         de son contenu tant que la bannière est là. */
      :root[data-install="open"] {
        --column-room: calc(117px + var(--tabbar-room) + var(--install-room));
      }

      :root[data-theme="dark"] {
        --bg: #0f1115;
        --fg: #f3f4f6;
        --ring: #2a2f3a;
        --surface: #151922;
        --surface-alt: #10151d;
        --surface-inset: #242b38;
        --button-bg: #f3f4f6;
        --button-fg: #101317;
        --legend: #a1a1aa;
        --pointer: #f3f4f6;
        --tooltip-bg: #f3f4f6;
        --tooltip-fg: #101317;
        --modal-surface: #151922;
        --modal-text: #f3f4f6;
        --modal-muted: #cbd5e1;
        --install-surface: #151922;
        --install-border: rgba(243, 244, 246, 0.12);
        --install-shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
        --install-title: #f3f4f6;
        --focus: #f59e0b;
        --masthead-accent: #dc2626;
        --pattern-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160' fill='%23f3f4f6'><text x='40' y='40' font-size='50'>☭</text><text x='120' y='120' font-size='50'>☭</text></svg>");
      }

      /* ===============================
   ACCESSIBILITÉ
   =============================== */

      /* Aucun style de focus n'existait : la navigation au clavier était invisible.
   :focus-visible ne se déclenche qu'au clavier, la souris reste inchangée. */
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      /* Respect de la préférence système « mouvement réduit ». Couvre aussi
   menu.css et bills.css, chargés dans ce même document. La rotation de la
   roue et l'effet billets, pilotés en JS, sont traités dans js/app.js. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* 1️⃣ Tout hérite de la police principale */
      *,
      *::before,
      *::after {
        font-family: inherit;
      }

      /* 2️⃣ Police système + lissage */
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: contain; /* bloque l'effet "rebond" sur mobile */
        touch-action: none; /* empêche le scroll tactile */
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg);
        color: var(--fg);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: 0;
        width: var(--bg-size);
        height: var(--bg-size);
        top: calc(50% - var(--bg-size) / 2);
        left: calc(50% - var(--bg-size) / 2);
        pointer-events: none;
        background-image: var(--pattern-image);
        background-repeat: repeat;
        background-size: var(--emoji-size) var(--emoji-size);
      }
      body::after {
        background-position: calc(var(--emoji-size) / 2) calc(var(--emoji-size) / 2);
      }

      /* Une hauteur ferme, et la bonne : c'est elle qui descend jusqu'à la carte
         de résultat pour lui dire de quelle place elle dispose.
         `svh`, jamais `vh` : sur Chrome Android, `100vh` est la hauteur de la
         fenêtre *barre d'adresse rétractée*, soit près de 70 px de plus que ce
         qui est réellement affiché — et comme le corps de la page ne défile
         pas, cette barre ne se rétracte jamais ici. La colonne calculait donc
         sa place dans une fenêtre plus haute que l'écran, et le bas de la carte
         finissait sous la barre d'onglets. La première déclaration est le repli
         des navigateurs sans `svh`. */
      .wrap {
        position: relative;
        z-index: 1;
        height: 100vh;
        height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: clamp(12px, 2.5vh, 40px);
        /* La barre d'onglets est fixée : sans cette réserve, elle recouvrirait
           le bas de la page. */
        padding-bottom: calc(12px + var(--tabbar-room));
        box-sizing: border-box;
      }
      /* Colonne flexible plutôt que grille : la roue garde sa taille (flex-shrink: 0)
         et la carte de résultat encaisse seule le manque de place. */
      .container {
        width: 100%;
        max-width: 720px;
        padding-inline: 12px;
        margin-top: clamp(10px, 2vh, 22px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        min-height: 0;
        box-sizing: border-box;
      }
      /* ===============================
   BANDEAU DE TITRE
   =============================== */

      /* Un bandeau de revue plutôt qu'une étiquette : titre en romaine sur deux
   lignes, refermé par un filet rouge. Le rouge de la marque n'est plus un pavé
   plein derrière le titre — il tient dans ce filet, ce qui laisse la roue être
   la seule tache de couleur de la page.

   Le titre se détache par une clairière, pas par un cadre : ::before étale un
   disque de la couleur du fond, opaque au centre et dissous sur les bords, qui
   efface la trame juste autour des lettres. La trame reste à pleine densité
   partout ailleurs.

   Deux essais ont précédé. Un bandeau opaque : il réglait le contraste, mais un
   rectangle plein rapporté sur un motif dense se voit comme une pièce cousue.
   Puis la trame atténuée sur toute la page : lisible, mais elle y perdait sa
   présence, alors que le problème ne se posait qu'au niveau du titre.

   Le disque déborde largement de la boîte (d'où ::before plutôt qu'un
   `background` sur .masthead) : un dégradé radial posé sur l'élément est rogné
   par ses bords, ce qui recoupe net le fondu en haut et en bas. */
      .masthead {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 10px;
        text-align: center;
      }
      .masthead::before {
        content: "";
        position: absolute;
        z-index: -1;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        width: min(460px, 86vw);
        height: 124px;
        pointer-events: none;
        background: radial-gradient(closest-side, var(--bg) 0%, var(--bg) 70%, transparent 100%);
      }
      h1 {
        margin: 0;
        display: grid;
        gap: 2px;
        font-family: var(--serif);
        font-weight: 700;
        text-transform: uppercase;
        line-height: 1.02;
      }
      /* Deux lignes de tailles très différentes : c'est le contraste qui fait
   la une, pas la taille absolue. */
      .masthead__lead {
        font-size: clamp(15px, 3.6vw, 20px);
        letter-spacing: 0.14em;
      }
      .masthead__main {
        font-size: clamp(26px, 6.6vw, 38px);
        letter-spacing: 0.02em;
      }
      .masthead__rule {
        width: 54px;
        height: 3px;
        border-radius: 999px;
        background: var(--masthead-accent);
      }
      /* Placement seul : l'apparence de la pastille vient de logo.css.
         Elle est posée en absolu dans .wrap, donc hors de la colonne : celle-ci
         compte sa hauteur au pixel (--column-room) et rien de ce qui est
         au-dessus de la roue ne doit bouger. Le retrait de 14 px laisse la place
         à l'écusson 🔗, qui déborde du médaillon de 8 px. */
      .site-logo {
        position: absolute;
        z-index: 6;
        top: clamp(12px, 2.5vh, 40px);
        right: max(14px, env(safe-area-inset-right, 0px));
      }
      /* La roue est posée à même le fond : le cadre blanc qui l'entourait
         mangeait de la hauteur sans rien dire de plus, et la carte de résultat
         est désormais la seule surface de la page — donc la seule chose que
         l'œil y cherche. */
      .wheel-area {
        /* Ce que le bouton déborde sous le disque, et que la zone doit rendre
           pour ne pas mordre sur la carte de résultat. */
        --spin-overhang: 4px;
        position: relative;
        width: 100%;
        display: grid;
        place-items: center;
        margin-bottom: var(--spin-overhang);
        flex-shrink: 0;
      }
      /* Placement seul : l'apparence du bouton vient de buttons.css, ombre
         comprise (`.btn-accent`), qui le détache du disque bariolé. */
      #spinBtn {
        position: absolute;
        left: 50%;
        bottom: calc(-1 * var(--spin-overhang));
        transform: translateX(-50%);
        z-index: 7;
        max-width: min(100%, 340px);
      }
      .pointer {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        z-index: 6;
        --w: 14px;
        --h: 22px;
        border-left: var(--w) solid transparent;
        border-right: var(--w) solid transparent;
        border-top: var(--h) solid var(--pointer);
      }
      /* La roue est bornée par la largeur *et* par la hauteur : le corps de la
         page ne défile pas, ce qui ne tient pas dans l'écran est perdu.
         `svh` plutôt que `dvh` : la petite hauteur de vue est stable, alors que
         la hauteur dynamique change quand la barre d'adresse du téléphone se
         replie — la roue aurait été redimensionnée en pleine rotation.
         La première déclaration est le repli des navigateurs sans `svh`.

         Deux bornes donc : la largeur voulue et le plafond en hauteur, ce
         dernier réservant déjà la place de la carte de résultat. */
      canvas {
        width: var(--wheel-size);
        width: min(var(--wheel-size), var(--wheel-cap));
        aspect-ratio: 1/1;
        display: block;
        border-radius: 50%;
        background: var(--surface-alt);
        box-shadow: inset 0 0 0 5px var(--surface-inset);
      }
      /* Rien ne bouge quand un résultat s'affiche : le titre, le bouton et la
         roue sont à leur place et à leur taille définitives dès le premier
         rendu, la carte occupant la hauteur qui lui était déjà réservée. */
      /* ===============================
   CARTE DE RÉSULTAT
   ===============================

   Le résultat se lit sous la roue, dans le flux de la page, et non plus dans
   une fenêtre modale posée par-dessus. La modale recouvrait la roue qu'elle
   commentait et il fallait la fermer avant de pouvoir retourner la roue ; la
   carte se laisse lire à côté du plateau et se remplace d'elle-même au tirage
   suivant.

   Le corps de la page ne défile pas : la carte est donc l'élément élastique de
   la colonne (`flex: 0 1 auto` + `min-height: 0`). Mais ce n'est pas elle qui
   défile — c'est son seul bloc de texte (`.result__scroll`). Le cadre, la croix
   et la rangée d'actions restent entiers en toutes circonstances : une carte
   qui défilait d'un bloc se faisait trancher net par la barre d'onglets, et ce
   bord coupé se lisait comme un bug plutôt que comme un contenu à faire défiler.

   Elle a la largeur du plateau — toute celle de la colonne : deux cartes de
   largeurs différentes empilées ne formaient pas une colonne. */
      .result {
        position: relative;
        width: 100%;
        max-width: 560px;
        /* Au-delà, c'est la roue qui disparaîtrait : passé ce plafond, c'est le
           texte de la carte qui défile. */
        max-height: 52svh;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid var(--ring);
        border-radius: 12px;
        background: var(--surface);
        text-align: left;
        display: flex;
        flex-direction: column;
        flex: 0 1 auto;
        min-height: 0;
      }

      /* Le texte du résultat, seule partie qui défile. `touch-action` : body
         porte `none` pour neutraliser le défilement de la page, sans cette
         exception le bloc ne défilerait pas au doigt.

         Sans ascenseur visible : la roue rend à la carte de quoi tout afficher
         (fitWheelToResult), le débordement est donc l'exception — un intitulé
         de huit lignes sur un téléphone court. Une barre grise en travers de la
         fiche, elle, était visible à chaque tirage dès que le calcul laissait
         un pixel de marge. Le défilement lui-même reste actif. */
      .result__scroll {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        scrollbar-width: none;
      }

      .result__scroll::-webkit-scrollbar {
        display: none;
      }

      /* Spécificité supérieure à `.result` : sans elle, `display` reprendrait le
         dessus sur le comportement par défaut de [hidden]. */
      .result[hidden] {
        display: none;
      }

      /* Un tirage qui remplace le précédent au même endroit se voit mal : sans
         ce fondu, seul le texte change, et rien ne dit que c'est un nouveau
         résultat. La classe est reposée à chaque tirage par js/app.js (une
         animation ne rejoue pas d'elle-même sur un élément déjà affiché).
         La préférence « mouvement réduit » l'annule — voir la règle globale en
         haut de cette feuille. */
      @keyframes result-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      .result.is-new {
        animation: result-in 0.16s ease-out both;
      }

      /* La hauteur de la croix (34 px, 44 au doigt — cf. buttons.css) : la tête
         la réserve pour que l'accroche ne passe pas dessous. */
      .result__head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        min-height: 34px;
        flex-shrink: 0;
      }

      @media (pointer: coarse) {
        .result__head {
          min-height: 44px;
        }
      }

      /* Positionnement seul : l'apparence des boutons vient de buttons.css. */
      .result__close {
        flex-shrink: 0;
        margin-top: -2px;
      }

      .result__intro {
        margin: 0;
        font-size: 12px;
        color: var(--legend);
        /* Évite le mot — ou le point d'exclamation — resté seul sur la seconde
           ligne. Ignoré par les navigateurs qui ne connaissent pas la propriété. */
        text-wrap: balance;
      }

      /* La romaine du bandeau de titre : l'intitulé du prélèvement est ce que
         l'on vient chercher, il se lit comme un titre d'article. */
      .result__title {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(16px, 4vw, 23px);
        font-weight: 700;
        line-height: 1.2;
      }

      /* Une ligne par donnée, libellé à gauche et valeur à droite, comme sur une
         fiche. En deux colonnes côte à côte, la valeur la plus courante
         (« 115,3 millions d'euros ») se cassait en deux lignes sur un téléphone,
         et la carte y perdait une rangée entière. */
      .result__facts {
        margin: 10px 0 0;
        padding-top: 8px;
        border-top: 1px solid var(--ring);
        display: grid;
        gap: 5px;
      }

      /* `center` et non `baseline` : aligner les lignes de base d'un libellé de
         11 px et d'une valeur de 14 px enfle la rangée de près de dix pixels,
         soit une ligne de texte perdue sur un téléphone. */
      .result__fact {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .result__fact + .result__fact {
        padding-top: 5px;
        border-top: 1px solid var(--ring);
      }

      .result__label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--legend);
      }

      .result__value {
        margin: 0;
        font-size: clamp(14px, 3.4vw, 17px);
        font-weight: 700;
        line-height: 1.25;
        text-align: right;
      }

      .result__year {
        color: var(--masthead-accent);
      }

      /* 51 % des prélèvements n'ont ni recette ni année : la mention grisée
         évite une carte réduite au seul intitulé, qu'on prenait pour un bug. */
      .result__value.result__unknown {
        font-weight: 500;
        opacity: 0.62;
      }

      /* Trois actions courtes sur une seule rangée, hors de la zone défilante :
         elles restent atteignables quelle que soit la longueur de l'intitulé.
         Les neuf pastilles de partage qui tenaient ici occupaient deux rangées
         et, avec les deux boutons de retour, plus de place que le résultat
         lui-même — elles sont passées dans la feuille « Partager ». */
      .result__actions {
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid var(--ring);
        gap: 8px;
        flex-shrink: 0;
      }

      /* Une grille plutôt qu'un flex-wrap : le nombre de pastilles par rangée est
   décidé, pas subi. En flex, les neuf boutons se cassaient en 6 + 3 selon la
   largeur du texte au-dessus. */
      .share-bar {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(9, auto);
        gap: 8px;
        justify-content: center;
      }
      .share-icon {
        width: 20px;
        height: 20px;
        display: block;
      }
      @media (max-width: 520px) {
        .share-bar {
          grid-template-columns: repeat(5, auto);
        }
      }

      /* Empêche un fond plus grand que l’écran */
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }

      #feedbackForm {
        background: var(--modal-surface) !important;
        color: var(--modal-text);
      }

      #feedbackForm input,
      #feedbackForm textarea {
        background: var(--surface-alt);
        color: var(--modal-text);
        border: 1px solid var(--ring);
        border-radius: 8px;
        box-sizing: border-box;
      }

      #feedbackStatus {
        color: var(--modal-muted) !important;
      }

      /* Posé au-dessus de la barre d'onglets, jamais dessus : les deux occupent
         le même bord de l'écran. Et jamais par-dessus la carte de résultat non
         plus : `data-install` (posé par js/app.js) fait réserver sa hauteur à la
         colonne, la roue rendant la différence comme elle le fait pour la carte. */
      :root[data-install="open"] .wrap {
        padding-bottom: calc(12px + var(--tabbar-room) + var(--install-room));
      }
      .install-banner {
        position: fixed;
        left: 50%;
        bottom: calc(12px + var(--tabbar-room));
        transform: translate(-50%, calc(100% + 24px));
        width: min(calc(100vw - 24px), 520px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        box-sizing: border-box;
        border: 1px solid var(--install-border);
        border-radius: 16px;
        background: var(--install-surface);
        box-shadow: var(--install-shadow);
        z-index: 9500;
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.24s ease,
          opacity 0.24s ease;
      }

      .install-banner.is-visible {
        transform: translate(-50%, 0);
        opacity: 1;
        pointer-events: auto;
      }

      .install-banner__title {
        color: var(--install-title);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.2;
      }

      .install-banner__actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      @media (max-width: 520px) {
        .install-banner {
          gap: 10px;
          padding: 12px;
        }

        .install-banner__title {
          font-size: 14px;
        }
      }

      /* ===============================
   MODALES
   ===============================

   Deux surfaces recouvrent encore la page : la feuille « Partager » et le
   formulaire de retour utilisateur. Elles partagent le même habillage — la
   nommer d'après l'une des deux (`.feedback-modal`) obligeait la seconde à
   emprunter le nom de la première. */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 12000;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
      }
      .modal-panel {
        background: var(--modal-surface, #fff);
        color: var(--modal-text, #111);
        padding: 18px;
        border-radius: 10px;
        max-width: 520px;
        width: 92%;
        box-sizing: border-box;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .modal-panel h3 {
        margin: 0 0 8px;
      }
      .modal-actions {
        margin-top: 14px;
      }
      .feedback-honeypot {
        display: none;
      }
      .feedback-type {
        margin: 0;
        padding: 0;
        border: 0;
      }
      .feedback-type legend {
        padding: 0;
        font-size: 13px;
        color: var(--modal-muted, #333);
      }
      .feedback-choice {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        font-size: 14px;
        cursor: pointer;
      }
      .feedback-label {
        display: block;
        margin-top: 8px;
      }
      .feedback-textarea {
        width: 100%;
        height: 120px;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 10px;
        font-size: 14px;
        resize: vertical;
      }
      .feedback-status {
        margin-top: 10px;
        font-size: 13px;
        color: var(--modal-muted, #333);
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Le coq du Modèle Social Français, en haut à droite : lien sortant vers
           son Linktree. `title` porte la même chose que l'infobulle, qui n'est
           que décorative (aria-hidden), et `alt` nomme la destination. -->
      <a
        class="site-logo"
        href="https://linktr.ee/lemodelesocialfrancais"
        target="_blank"
        rel="noopener noreferrer"
        title="Le Modèle Social Français — Voir mon Linktree"
      >
        <img
          class="site-logo__img"
          src="images/le-modele-social-francais.png"
          alt="Le Modèle Social Français"
          width="48"
          height="48"
          decoding="async"
        />
        <span class="site-logo__tip" aria-hidden="true">🔗 Mon Linktree</span>
      </a>
      <header class="masthead">
        <h1>
          <span class="masthead__lead">La roue de</span>
          <span class="masthead__main">La servitude</span>
        </h1>
        <div class="masthead__rule" aria-hidden="true"></div>
      </header>
      <div class="container">
        <div class="wheel-area" id="wheelArea">
          <div class="pointer"></div>
          <!-- aria-label est réactualisé par updateWheelLabel() (js/app.js) : il
               porte le décompte des entrées restantes, qui n'est plus écrit
               nulle part ailleurs. -->
          <canvas
            id="wheelCanvas"
            width="800"
            height="800"
            role="img"
            aria-label="Roue des taxes et prélèvements français"
          >
            La roue des taxes et prélèvements obligatoires français. Utilisez le bouton « Tourner la
            roue » pour tirer une entrée au sort.
          </canvas>
          <!-- Le bouton chevauche le bas du disque : la commande est posée sur
               son effet, et la colonne n'a plus à lui réserver de rangée. Il
               suit la roue quand elle se resserre pour la carte de résultat. -->
          <button id="spinBtn" class="btn btn-accent btn-lg btn-pill" type="button">
            Tourner la roue
          </button>
        </div>
        <!-- Le résultat du tirage, dans le flux, sous la roue. `hidden` tant
     qu'aucun tirage n'a eu lieu ; sa hauteur lui est réservée d'avance
     (--card-room), la roue ne bouge donc pas quand il paraît. -->
        <section id="resultCard" class="result" hidden aria-label="Résultat du tirage">
          <!-- La tête de carte porte l'accroche et loge la croix. Elle est hors
               de la zone défilante : l'intitulé récupère ainsi toute la largeur
               (44 px de plus, soit près d'une ligne de moins sur les noms les
               plus longs) et rien ne vient jamais glisser sous la croix. -->
          <div class="result__head">
            <p class="result__intro" id="resultIntro"></p>
            <button
              id="resultClose"
              class="result__close btn btn-icon btn-sm btn-secondary btn-close"
              type="button"
              aria-label="Fermer le résultat"
            ></button>
          </div>
          <!-- role="status" : le résultat d'un tirage n'est annoncé aux lecteurs
       d'écran que par cette région, la carte ne prenant pas le focus. -->
          <div class="result__scroll">
            <div id="resultText" role="status" aria-live="polite"></div>
          </div>
          <!-- Deux actions, et deux seulement : elles doivent tenir sur une
     rangée jusque sur un écran de 320 px, sinon la carte se replie sur
     un téléphone court. Les libellés sont abrégés, `aria-label` porte
     l'intitulé complet — et le contient, sinon la commande vocale ne
     retrouve plus le bouton. -->
          <div class="result__actions btn-row btn-row--center">
            <button
              id="btn-share"
              class="btn btn-secondary btn-sm"
              type="button"
              aria-label="Partager ce résultat"
            >
              Partager
            </button>
            <button
              id="btn-feedback"
              class="btn btn-secondary btn-sm"
              type="button"
              aria-label="Signaler une erreur ou apporter un complément"
            >
              Signaler
            </button>
          </div>
        </section>
      </div>
    </div>

    <div id="installPrompt" class="install-banner" hidden aria-hidden="true">
      <div class="install-banner__title">Installer l'application</div>
      <div class="install-banner__actions">
        <button id="installPromptAction" class="btn btn-accent btn-sm btn-pill" type="button">
          Installer
        </button>
        <button
          id="installPromptClose"
          class="btn btn-icon btn-sm btn-secondary btn-close"
          type="button"
          aria-label="Fermer"
        ></button>
      </div>
    </div>

    <!-- Feuille « Partager » : les neuf pastilles vivaient dans la carte de
         résultat, où elles occupaient deux rangées sur un téléphone. -->
    <div id="shareModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
      <div class="modal-panel">
        <h3 id="shareTitle">Partager ce résultat</h3>
        <!-- `aria-label` sert à la fois de nom accessible et d'info-bulle (.btn-tip,
         buttons.css) : plus de `title` à garder synchronisé. -->
        <div class="share-bar" id="shareBar">
          <!-- Logos de marque repris du projet « Jours de retraite »
               (lemodelesocialfrancais.github.io/joursderetraite). Ils remplacent des
               glyphes dessinés à la main, dont plusieurs se devinaient mal.
               Certains sont tracés, d'autres pleins : chaque <svg> porte donc ses
               propres attributs plutôt qu'un jeu commun. -->
          <button
            class="btn btn-icon btn-sm btn-pill btn-secondary btn-tip"
            type="button"
            data-platform="facebook"
            aria-label="Partager sur Facebook"
          >
            <svg
              class="share-icon"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-sm btn-pill btn-secondary btn-tip"
            type="button"
            data-platform="x"
            aria-label="Partager sur X / Twitter"
          >
            <svg
              class="share-icon"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-sm btn-pill btn-secondary btn-tip"
            type="button"
            data-platform="instagram"
            aria-label="Partager sur Instagram"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.7 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07a83 83 0 0 1-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.64-.07-4.85s.02-3.58.07-4.85c.15-3.23 1.67-4.77 4.92-4.92A84 84 0 0 1 12 2.16M12 0C8.74 0 8.33.01 7.05.07 2.7.27.27 2.7.07 7.05.01 8.33 0 8.75 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98 1.28.06 1.7.07 4.95.07s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.7.07-4.95s-.01-3.67-.07-4.95C23.73 2.7 21.3.27 16.95.07A84 84 0 0 0 12 0m0 5.84a6.16 6.16 0 1 0 0 12.32 6.16 6.16 0 0 0 0-12.32M12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8m6.4-11.84a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-sm btn-pill btn-secondary btn-tip"
            type="button"
            data-platform="linkedin"
            aria-label="Partager sur LinkedIn"
          >
            <svg
              class="share-icon"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6M2 9h4v12H2z"
              />
              <circle cx="4" cy="4" r="2" />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-sm btn-pill btn-secondary btn-tip"
            type="button"
            data-platform="snapchat"
            aria-label="Partager sur Snapchat"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12.2.8c1 0 4.35.27 5.94 3.81.52 1.2.4 3.22.3 4.85v.06l-.04.51q.11.09.4.1.46-.04 1.04-.31a1 1 0 0 1 .46-.1q.28 0 .5.09c.46.15.74.48.74.83q.03.68-1.21 1.17l-.34.12c-.45.14-1.14.36-1.34.81q-.14.34.12.87l.02.01c.06.14 1.52 3.48 4.79 4.02a.5.5 0 0 1 .42.5l-.05.23q-.35.85-3.14 1.27c-.06.1-.12.38-.17.57q-.04.26-.13.56-.12.4-.56.4h-.03a3 3 0 0 1-.53-.07 6 6 0 0 0-1.28-.14q-.45 0-.9.08c-.6.1-1.13.46-1.73.88-.86.6-1.83 1.29-3.3 1.29l-.18-.02h-.15a5.3 5.3 0 0 1-3.27-1.28c-.6-.42-1.11-.78-1.71-.89a7 7 0 0 0-.93-.07c-.54 0-.96.09-1.27.15a3 3 0 0 1-.54.07c-.38 0-.52-.22-.58-.42q-.1-.3-.14-.57c-.05-.18-.1-.5-.17-.57Q.4 19.27.06 18.4L0 18.17a.5.5 0 0 1 .42-.5c3.26-.55 4.73-3.89 4.8-4.03v-.03q.28-.52.13-.86c-.2-.44-.89-.66-1.34-.81l-.34-.12c-1.1-.44-1.26-.93-1.2-1.28.1-.47.68-.79 1.17-.79q.22 0 .38.08.64.3 1.1.3.36-.02.47-.11l-.04-.57c-.1-1.62-.23-3.65.3-4.84A6.3 6.3 0 0 1 11.73.8h.48z"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-sm btn-pill btn-secondary btn-tip"
            type="button"
            data-platform="tiktok"
            aria-label="Partager sur TikTok"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15.5 3a5.2 5.2 0 0 0 3 3.02V9a6 6 0 0 1-3.2-.9v6.18a5.3 5.3 0 1 1-5.3-5.3q.35 0 .7.06v2.86a2.52 2.52 0 1 0 1.86 2.42V3z"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-sm btn-pill btn-secondary btn-tip"
            type="button"
            data-platform="whatsapp"
            aria-label="Partager sur WhatsApp"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97s-.47-.14-.67.15-.76.97-.94 1.17-.34.22-.64.07-1.26-.46-2.4-1.47a9 9 0 0 1-1.64-2.06c-.18-.3-.02-.46.13-.6.13-.14.3-.35.44-.53s.2-.3.3-.5.05-.36-.03-.51-.66-1.62-.91-2.21c-.24-.58-.49-.5-.67-.51l-.57-.01c-.2 0-.52.07-.8.37-.26.3-1.03 1.02-1.03 2.48s1.06 2.88 1.21 3.08 2.1 3.2 5.08 4.48q1.04.44 1.7.63c.7.22 1.35.2 1.86.11.57-.08 1.76-.71 2-1.4s.26-1.3.18-1.42c-.07-.13-.27-.2-.57-.35m-5.42 7.4A10 10 0 0 1 7 20.42l-.36-.22-3.74.99 1-3.65-.23-.38a10 10 0 0 1-1.51-5.26 9.9 9.9 0 0 1 16.87-6.98 9.8 9.8 0 0 1 2.9 7 9.9 9.9 0 0 1-9.89 9.88m8.41-18.3a11.8 11.8 0 0 0-8.4-3.5 11.9 11.9 0 0 0-10.3 17.84L.05 24l6.31-1.65a12 12 0 0 0 5.69 1.44c6.55 0 11.89-5.33 11.9-11.89a11.8 11.8 0 0 0-3.49-8.41"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-sm btn-pill btn-secondary btn-tip"
            type="button"
            data-platform="telegram"
            aria-label="Partager sur Telegram"
          >
            <svg class="share-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="m2.12 11.08 19.04-7.35c.89-.34 1.66.21 1.38 1.51L19.3 20.51c-.24 1.14-.93 1.13-1.52.5l-4.24-3.93-2.04 1.97c-.23.22-.42.41-.85.41l.3-4.3 7.84-7.08c.34-.3-.08-.47-.53-.16l-9.68 6.1L4.4 12.7c-.9-.29-.92-.9.2-1.35z"
              />
            </svg>
          </button>
          <button
            class="btn btn-icon btn-sm btn-pill btn-secondary btn-tip"
            type="button"
            id="copyText"
            aria-label="Copier le texte"
          >
            <svg
              class="share-icon"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path d="M4 16a2 2 0 0 1-2-2V4c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2" />
            </svg>
          </button>
        </div>
        <div class="modal-actions btn-row btn-row--end">
          <button type="button" id="closeShare" class="btn btn-secondary">Fermer</button>
        </div>
      </div>
    </div>

    <!-- Modal feedback -->
    <div
      id="feedbackModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="feedbackTitle"
    >
      <form id="feedbackForm" class="modal-panel">
        <h3 id="feedbackTitle">Votre retour sur ce prélèvement</h3>
        <input type="hidden" id="formResult" name="resultText" value="" />
        <!-- Le type était porté par deux boutons distincts dans la carte, et le
             titre du formulaire annonçait « complément » dans les deux cas. Un
             seul bouton l'ouvre désormais, le type se choisit ici. -->
        <fieldset class="feedback-type">
          <legend>Votre message porte sur</legend>
          <label class="feedback-choice">
            <input type="radio" name="type" value="info" checked />
            Un complément d'information
          </label>
          <label class="feedback-choice">
            <input type="radio" name="type" value="error" />
            Une erreur à corriger
          </label>
        </fieldset>
        <input
          type="text"
          name="honeypot"
          id="honeypot"
          class="feedback-honeypot"
          autocomplete="off"
          tabindex="-1"
          aria-hidden="true"
        />
        <label class="feedback-label">
          Votre message
          <textarea
            id="formMessage"
            name="userMessage"
            required
            class="feedback-textarea"
          ></textarea>
        </label>
        <div class="modal-actions btn-row btn-row--end">
          <button type="button" id="closeFeedback" class="btn btn-secondary">Annuler</button>
          <button type="submit" class="btn btn-primary">Envoyer</button>
        </div>
        <div id="feedbackStatus" class="feedback-status" role="status" aria-live="polite"></div>
      </form>
    </div>

    <script type="module" src="./js/app.js?v=83118b0e"></script>
  </body>
</html>
